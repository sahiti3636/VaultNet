name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y netcat-openbsd libssl-dev

      - name: Build (optimized + loadgen)
        run: make all loadgen unit

      - name: Unit tests
        run: ./bin/vaultnet_unit

      - name: Concurrency test
        run: bash test_concurrency.sh

      - name: Crash recovery test
        run: CRASH_ITERS=5 bash tests/crash_test.sh

      - name: TLS smoke test
        run: |
          bash gen_cert.sh
          rm -f vaultnet.snap vaultnet.snap.tmp vaultnet.wal vaultnet_audit.log vaultnet.lock
          ./bin/vaultnet_server 18080 vaultnet.crt vaultnet.key &
          SRV=$!
          sleep 1
          bash tests/tls_smoke.sh 18080 vaultnet.crt
          kill $SRV 2>/dev/null || true
          wait $SRV 2>/dev/null || true
          rm -f vaultnet.snap vaultnet.snap.tmp vaultnet.wal vaultnet_audit.log vaultnet.lock vaultnet.crt vaultnet.key

      - name: Benchmark (smoke, 8s)
        run: |
          rm -f vaultnet.snap vaultnet.snap.tmp vaultnet.wal vaultnet_audit.log vaultnet.lock
          ./bin/vaultnet_server 18080 &
          SRV=$!
          sleep 1
          ./bin/vaultnet_loadgen -h 127.0.0.1 -p 18080 -t 8 -c 8 -w 2
          kill $SRV 2>/dev/null || true
          wait $SRV 2>/dev/null || true
          rm -f vaultnet.snap vaultnet.snap.tmp vaultnet.wal vaultnet_audit.log vaultnet.lock

  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y netcat-openbsd libssl-dev

      - name: Build ThreadSanitizer
        run: make tsan

      - name: TSan concurrency test
        env:
          TSAN_OPTIONS: halt_on_error=1
          SERVER_BIN: ./bin/vaultnet_server_tsan
          CLIENT_BIN: ./bin/vaultnet_client_tsan
        run: |
          rm -f vaultnet.snap vaultnet.snap.tmp vaultnet.wal vaultnet_audit.log vaultnet.lock
          TSAN_OPTIONS=halt_on_error=1 ./bin/vaultnet_server_tsan 18080 &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT
          sleep 2
          printf 'REGISTER alice alicepass\nQUIT\n' | nc -w 15 127.0.0.1 18080
          printf 'REGISTER bob bobpass8\nQUIT\n'   | nc -w 15 127.0.0.1 18080
          printf 'LOGIN alice alicepass\nDEPOSIT 100000\nLOGOUT\nQUIT\n' | nc -w 15 127.0.0.1 18080
          printf 'LOGIN bob bobpass8\nDEPOSIT 100000\nLOGOUT\nQUIT\n'   | nc -w 15 127.0.0.1 18080
          PIDS=()
          for i in $(seq 1 20); do
            printf 'LOGIN alice alicepass\nDEPOSIT 10\nLOGOUT\nQUIT\n' | nc -w 15 127.0.0.1 18080 &
            PIDS+=($!)
            printf 'LOGIN alice alicepass\nTRANSFER bob 10\nLOGOUT\nQUIT\n' | nc -w 15 127.0.0.1 18080 &
            PIDS+=($!)
          done
          for pid in "${PIDS[@]}"; do wait "$pid"; done
          kill $SRV 2>/dev/null || true
          wait $SRV 2>/dev/null || true
          echo "TSan run complete (no data races)"

      - name: Build AddressSanitizer
        run: make asan

      - name: ASan smoke test
        env:
          ASAN_OPTIONS: halt_on_error=1 detect_leaks=1
        run: |
          rm -f vaultnet.snap vaultnet.snap.tmp vaultnet.wal vaultnet_audit.log vaultnet.lock
          ASAN_OPTIONS="halt_on_error=1 detect_leaks=1" ./bin/vaultnet_server_asan 18080 &
          SRV=$!
          sleep 1
          printf 'REGISTER alice alicepass\nQUIT\n' | nc -w 15 127.0.0.1 18080
          printf 'LOGIN alice alicepass\nDEPOSIT 50000\nTRANSFER alice 1000\nBALANCE\nLOGOUT\nQUIT\n' \
              | nc -w 15 127.0.0.1 18080
          kill $SRV 2>/dev/null || true
          wait $SRV 2>/dev/null || true
          echo "ASan run complete (no memory errors)"
